# Railway config — Frontend (TanStack Start / Nitro node-server)
# Set di Railway Dashboard:
#   Root Directory  → front
#   Build Command   → (pakai yang di bawah)
#   Start Command   → (pakai yang di bawah)

[build]
builder = "nixpacks"
buildCommand = "NITRO_PRESET=node-server npm install && NITRO_PRESET=node-server npm run build"

[deploy]
startCommand = "NITRO_HOST=0.0.0.0 HOST=0.0.0.0 node .output/server/index.mjs"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
